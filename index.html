<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/images/vellocity-express-single-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velexp</title>
    <script>
      var global = global || window;
      </script>
    <script>
      // Applies the saved theme before first paint, reading the same
      // "velexp-ui" localStorage key the uiStore zustand persist middleware
      // owns (src/stores/uiStore.js) -- without this, a returning
      // light/lavender-theme user would see a flash of the default dark
      // theme while React boots and rehydrates the store.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("velexp-ui") || "null");
          var saved_mode = saved && saved.state && saved.state.themeMode;
          var mode = ["light", "lavender"].indexOf(saved_mode) !== -1 ? saved_mode : "dark";
          document.documentElement.setAttribute("data-theme", mode);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
